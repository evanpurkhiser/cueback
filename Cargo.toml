[package]
name = "cueback"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "The flight recorder for your DJ sets"
license = "MIT"
repository = "https://github.com/evanpurkhiser/cueback"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml"] }
humantime-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
