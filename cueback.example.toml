[storage]
# Active recordings use the hidden .live directory. Completed recordings are
# promoted into a session directory containing master.flac.
recordings_dir = "recordings"

[device]
# Omit device_address to discover the XDJ-RX3 from PRO DJ LINK announcements.
# device_address = "10.0.0.200"
announcement_bind = "0.0.0.0:50000"
announcement_timeout = "10s"
pcm_port = 7355
pcm_idle_timeout = "5s"
reconnect_delay = "2s"

[recording]
silence_timeout = "5m"
silence_threshold = 0
ffmpeg = "ffmpeg"
